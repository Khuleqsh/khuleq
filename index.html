<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Миний сайт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--s1:#121212;--s2:#1a1a1a;--ln:#262626;--tx:#ececec;--mu:#8a8a8a;--ac:#fff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Manrope,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.bar{max-width:1120px;margin:0 auto;padding:14px clamp(20px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:24px}
#brand{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;font-style:none;color:var(--ac);text-decoration:none;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:7px 14px;border-radius:999px;color:var(--mu);text-decoration:none;font-size:.92rem;white-space:nowrap;transition:color .15s,background .15s}
nav a:hover{color:var(--ac)}
nav a.on{background:var(--ac);color:#000;font-weight:600}
#admin{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px;background:var(--s2);border-top:1px solid var(--ln)}
#admin:empty{display:none}
#admin span{color:var(--mu);font-size:.85rem;margin-right:8px}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:clamp(32px,6vw,72px) clamp(20px,5vw,48px) 96px}
footer{border-top:1px solid var(--ln);padding:28px;text-align:center;color:var(--mu);font-size:.85rem}
h1{font-weight:800;margin:0;line-height:1.05}
h2{font-size:1.4rem;margin:72px 0 24px;color:var(--tx);font-weight:800;letter-spacing:-.02em}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--ln)}
.hd h1{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.03em}
.hero{display:grid;grid-template-columns:1fr minmax(0,300px);gap:clamp(28px,6vw,80px);align-items:center;position:relative;isolation:isolate;padding:clamp(8px,3vw,32px) 0 24px}
.hero::before{content:"";position:absolute;top:-25%;right:-15%;width:65%;height:130%;background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent);pointer-events:none;z-index:-1}
.hero h1{font-size:clamp(3rem,9vw,7rem);letter-spacing:-.04em;line-height:.95;overflow-wrap:anywhere}
.ph{order:2}
.ph img,.ph0{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;filter:grayscale(1) contrast(1.08);display:block;box-shadow:0 0 0 1px var(--ln),0 30px 60px -20px rgba(0,0,0,.8)}
.ph0{background:linear-gradient(160deg,var(--s2),var(--s1))}
.bio{color:#c4c4c4;font-size:1.1rem;max-width:52ch;white-space:pre-wrap;margin:28px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.grid.tx{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.c{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s}
.c:hover{border-color:#4a4a4a}
.c.t{padding:26px}
.c h3{margin:0;font-size:1.15rem;line-height:1.3}
.c small{color:var(--mu);font-size:.8rem;margin-right:12px}
.c p{margin:0;color:#b0b0b0;white-space:pre-wrap;overflow-wrap:anywhere}
.c iframe,.c video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000;display:block}
.c iframe.sp{aspect-ratio:auto;height:152px}
.c iframe.sp.big{height:352px}
.c img{width:100%;border-radius:8px}
.c audio{width:100%}
.lk{color:var(--ac);overflow-wrap:anywhere}
main>p.mu{padding:48px 0;font-size:1.1rem}
.mu{color:var(--mu)}
.ttl{all:unset;cursor:pointer;font:700 1.25rem/1.3 Manrope,sans-serif;color:var(--ac);letter-spacing:-.01em}
.ttl:hover{text-decoration:underline;text-underline-offset:4px}
.ex{font-family:Lora,serif;font-size:1.02rem;line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ad{display:flex;gap:8px;margin-top:4px}
button,.b{font:inherit;font-size:.9rem;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:6px 16px;cursor:pointer;transition:border-color .15s}
button:hover{border-color:#777}
.pri{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:28px;width:min(700px,92vw);max-height:90vh;box-shadow:0 40px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(3px)}
.rt{font-family:Lora,serif;font-size:1.15rem;line-height:1.9;white-space:pre-wrap;margin-top:20px}
.rt.poem{text-align:center;font-style:italic}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:.9rem}
input,select,textarea{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 12px}
textarea{min-height:180px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.hint{color:var(--mu);font-size:.85rem;margin-top:4px}
[hidden]{display:none!important}
.cmt{padding:14px 0;border-top:1px solid var(--ln)}
.cmt b{margin-right:12px}
.cmt small{color:var(--mu)}
.cmt p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#c4c4c4}
#cm-l{margin-top:24px}
@media(max-width:760px){
 .bar{flex-direction:column;align-items:flex-start;gap:8px;padding-block:12px}
 nav{width:100%}
 .hero{grid-template-columns:1fr}
 .ph{order:0;max-width:220px}
 .hd{margin-bottom:28px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a id="brand" href="#home"></a>
    <nav id="nav"></nav>
  </div>
  <div id="admin"></div>
</header>
<main id="main"></main>
<footer id="ft"></footer>

<dialog id="rd"></dialog>

<dialog id="cm">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3 id="cm-t" style="margin:0;font-size:1.2rem"></h3><button data-a="close">Хаах</button></div>
  <form id="cf">
    <label>Нэр</label>
    <input name="nm" maxlength="40" required>
    <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
    <label>Коммент</label>
    <textarea name="tx" maxlength="500" required style="min-height:90px"></textarea>
    <div class="row"><span class="hint" id="cm-s" style="margin-right:auto"></span><button class="pri">Илгээх</button></div>
  </form>
  <div id="cm-l"></div>
</dialog>

<dialog id="lg">
  <form id="lf">
    <label>Имэйл</label>
    <input name="em" type="email" autocomplete="username" required>
    <label>Нууц үг</label>
    <input name="pw" type="password" autocomplete="current-password" required>
    <p class="hint" id="lg-s"></p>
    <div class="row"><button type="button" data-a="close">Болих</button><button class="pri">Нэвтрэх</button></div>
  </form>
</dialog>

<dialog id="dm">
  <form id="fm">
    <input type="hidden" name="iid">
    <label>Төрөл</label>
    <select name="kind"></select>
    <label>Гарчиг</label>
    <input name="ttl" required>
    <div data-k="film playlist video link">
      <label>Холбоос эсвэл файлын зам</label>
      <input name="link" placeholder="YouTube, Spotify, SoundCloud, mp4 холбоос эсвэл videos/kino.mp4">
      <div data-k="film">
        <input type="file" name="vf" accept="video/mp4,video/webm" style="margin-top:8px">
        <p class="hint" id="up-s">mp4 файл сонговол Firebase руу шууд хуулагдана. Firebase Storage холбоогүй бол зөвхөн зам нь бөглөгдөнө, файлаа videos хавтас руу өөрөө хуулна.</p>
      </div>
    </div>
    <div data-k="film">
      <label>Орчуулгын файл (.vtt, заавал биш)</label>
      <input name="subs" placeholder="subs/kino.vtt">
    </div>
    <label>Тайлбар эсвэл бичвэр</label>
    <textarea name="txt"></textarea>
    <div class="row"><button type="button" data-a="close">Болих</button><button class="pri">Хадгалах</button></div>
  </form>
</dialog>

<dialog id="am">
  <form id="fa">
    <label>Нэр</label>
    <input name="nm" required>
    <label>Миний тухай</label>
    <textarea name="bio"></textarea>
    <label>Зураг</label>
    <input type="file" name="pf" accept="image/*">
    <p class="hint" id="pst">Зураг автоматаар жижигрүүлэгдэнэ. Эсвэл доор зургийн холбоос, жишээ нь me.jpg гэж бичнэ.</p>
    <input name="purl" placeholder="me.jpg эсвэл https://…" style="margin-top:8px">
    <div class="row"><button type="button" data-a="close">Болих</button><button class="pri">Хадгалах</button></div>
  </form>
</dialog>

<script>
// ===== Тохиргоо =====
// Нууц хаалга: сайтын хаяг дараа нь /#нууц-үг-хаалга гэж бичиж орно. Хоёуланг нь өөрөө солино.
const CFG = {
  door: 'khuleq-zasvar', pass: '1234',
  // Firebase тохиргоо (Project settings → Your apps → Web app). projectId хоосон бол сайт Firebase-гүйгээр ажиллана.
  // storageBucket-ийг зөвхөн mp4 файлыг шууд хуулах бол бөглөнө (Blaze төлөвлөгөө шаардлагатай).
  firebase: {
    apiKey: 'AIzaSyCOEOmK20vogzYmcmraY1rOc2hUZ9mShAg',
    authDomain: 'khuleq-c5d02.firebaseapp.com',
    projectId: 'khuleq-c5d02',
    storageBucket: 'khuleq-c5d02.appspot.com',
    appId: '1:773541175672:web:86af4b5f0828d7e710a88d'
  }
};
const TYPES = { film:'Кино', post:'Тэмдэглэл', poem:'Шүлэг', story:'Зохиол', playlist:'Playlist', video:'Бичлэг', link:'Холбоос' };
const TEXT = ['post','poem','story'];

// Нийтэд харагдах агуулга. “Экспорт” товчоор авсан кодыг SEED-ийн оронд буулгана.
const SEED = {
  profile: { name:'Таны нэр', bio:'Өөрийнхөө тухай энд бичнэ. Зүүн доорх “Засах” товчийг дарж нууц үгээ оруулаад өөрчилнө.', photo:'' },
  items: [
    { id:'a1', type:'poem', title:'Жишээ шүлэг', body:'Шөнө дундын цонхны цаанаас\nЦас намуухан буулаа.\nХэнд ч хэлээгүй үгс\nЦасан дээр өөрсдөө бичигдлээ.', date:'2026-11-08' },
    { id:'a2', type:'post', title:'Анхны тэмдэглэл', body:'Энэ бол жишээ бичвэр. Устгаад өөрийнхөө бичвэрийг нэмээрэй.', date:'2026-11-08' }
  ]
};

// ===== Төлөв =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FBON = !!CFG.firebase.projectId, FBST = FBON && !!CFG.firebase.storageBucket;
let S; try { if (!FBON) S = JSON.parse(localStorage.getItem('site-v1')); } catch(e) {}
S = S || structuredClone(SEED);
let admin = !FBON && sessionStorage.getItem('adm') === '1';
let isLoading = FBON; // ШИНЭЭР НЭМСЭН: Firebase уншиж дуустал Loading төлөв үүсгэх

const save = () => {
  if (FBON) { FB.saveSite(S).catch(e => alert('Хадгалж чадсангүй: ' + e.message)); return; }
  try { localStorage.setItem('site-v1', JSON.stringify(S)); } catch(e) { alert('Хадгалах зай дүүрсэн байна. Зургийг жижигрүүлж эсвэл файлын зам ашиглана уу.'); }
};

// ===== Холбоос хувиргагч =====
function embed(u) {
  u = String(u || '').trim();
  if (/^javascript:/i.test(u)) return '';
  const e = esc(u); let m;
  const fr = (src, cls='') => `<iframe class="${cls}" src="${src}" loading="lazy" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>`;
  if (m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/)) return fr(`https://www.youtube-nocookie.com/embed/${m[1]}`);
  if (m = u.match(/youtube\.com\/playlist\?(?:.*&)?list=([\w-]+)/)) return fr(`https://www.youtube-nocookie.com/embed/videoseries?list=${m[1]}`);
  if (m = u.match(/open\.spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|episode|show|artist)\/(\w+)/)) return fr(`https://open.spotify.com/embed/${m[1]}/${m[2]}`, m[1]=='track'||m[1]=='episode' ? 'sp' : 'sp big');
  if (/soundcloud\.com\//.test(u)) return fr(`https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}`, 'sp');
  if (m = u.match(/vimeo\.com\/(\d+)/)) return fr(`https://player.vimeo.com/video/${m[1]}`);
  if (/\.(mp4|webm|mov)(\?|$)/i.test(u)) return `<video controls preload="metadata" playsinline src="${e}"></video>`;
  if (/\.(mp3|ogg|wav|m4a)(\?|$)/i.test(u)) return `<audio controls src="${e}"></audio>`;
  if (/\.(jpe?g|png|gif|webp|avif)(\?|$)/i.test(u)) return `<img src="${e}" alt="" loading="lazy">`;
  let host = u; try { host = new URL(u).hostname; } catch(x) {}
  return `<a class="lk" href="${e}" target="_blank" rel="noopener">${esc(host)}</a>`;
}
function media(it) {
  if (it.type == 'film' && /\.(mp4|webm|mov)(\?|$)/i.test(it.url || ''))
    return `<video controls preload="metadata" playsinline><source src="${esc(it.url)}">${it.subs ? `<track kind="subtitles" srclang="mn" label="Монгол" src="${esc(it.subs)}" default>` : ''}</video>`;
  return it.url ? embed(it.url) : '';
}

// ===== Дүрслэл =====
function card(it) {
  const ad = `<span class="ad"><button data-a="cm" data-id="${it.id}">Коммент</button>${admin ? `<button data-a="edit" data-id="${it.id}">Засах</button><button data-a="del" data-id="${it.id}">Устгах</button>` : ''}</span>`;
  const meta = `<div><small>${TYPES[it.type]}</small><small>${esc(it.date)}</small></div>`;
  if (TEXT.includes(it.type)) {
    const ex = (it.body || '').split('\n').slice(0, 3).join('\n').slice(0, 160);
    return `<article class="c t"><button class="ttl" data-a="read" data-id="${it.id}">${esc(it.title)}</button>${meta}<p class="ex">${esc(ex)}</p>${ad}</article>`;
  }
  return `<article class="c">${media(it)}<h3>${esc(it.title)}</h3>${meta}${it.body ? `<p>${esc(it.body)}</p>` : ''}${ad}</article>`;
}
function home() {
  const p = S.profile, rec = S.items.slice(0, 6);
  return `<section class="hero"><div class="ph">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : '<div class="ph0"></div>'}</div>
  <div><h1>${esc(p.name)}</h1><p class="bio">${esc(p.bio)}</p>${admin ? '<button data-a="about">Миний тухайг засах</button>' : ''}</div></section>
  ${rec.length ? `<h2>Сүүлд нэмсэн</h2><div class="grid">${rec.map(card).join('')}</div>` : ''}`;
}
function list(k) {
  const its = S.items.filter(i => i.type == k);
  return `<div class="hd"><h1>${TYPES[k]}</h1>${admin ? `<button class="pri" data-a="add" data-k="${k}">Нэмэх</button>` : ''}</div>
  ${its.length ? `<div class="grid ${TEXT.includes(k) ? 'tx' : ''}">${its.map(card).join('')}</div>` : '<p class="mu">Одоогоор юу ч алга.</p>'}`;
}
function render() {
  // ШИНЭЭР НЭМСЭН: Уншиж байх үед түр харуулах дэлгэц
  if (isLoading) {
    $('#brand').textContent = '';
    document.title = 'Уншиж байна...';
    $('#nav').innerHTML = '';
    $('#admin').innerHTML = '';
    $('#main').innerHTML = '<div style="display:flex; justify-content:center; padding:100px 0; color:var(--mu);">Мэдээлэл татаж байна...</div>';
    $('#ft').textContent = '';
    return;
  }

  const h = location.hash.slice(1) || 'home', k = h in TYPES ? h : 'home';
  $('#brand').textContent = S.profile.name;
  document.title = S.profile.name;
  $('#ft').textContent = '© ' + new Date().getFullYear() + ' ' + S.profile.name;
  $('#nav').innerHTML = `<a href="#home" class="${k=='home'?'on':''}">Миний тухай</a>` + Object.entries(TYPES).map(([t, v]) => `<a href="#${t}" class="${k==t?'on':''}">${v}</a>`).join('');
  $('#admin').innerHTML = admin
    ? '<span>Засварын горим</span>' + (FBON ? '' : '<button data-a="export">Экспорт</button><button data-a="reset">Цэвэрлэх</button>') + '<button data-a="out">Гарах</button>'
    : '';
  $('#main').innerHTML = k == 'home' ? home() : list(k);
}

// ===== Засвар =====
const fm = $('#fm'), fe = fm.elements;
fe.kind.innerHTML = Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
const sync = () => fm.querySelectorAll('[data-k]').forEach(d => d.hidden = !d.dataset.k.split(' ').includes(fe.kind.value));
fe.kind.onchange = sync;
let upl = false;
fe.vf.onchange = () => {
  const f = fe.vf.files[0]; if (!f) return;
  if (!FBST) { fe.link.value = 'videos/' + f.name; return; }
  const st = $('#up-s'); upl = true; st.textContent = 'Хуулж байна 0%';
  FB.upload(f, 'videos/' + Date.now() + '-' + f.name.replace(/[^\w.-]/g, '_'), p => st.textContent = 'Хуулж байна ' + Math.round(p * 100) + '%')
    .then(u => { fe.link.value = u; st.textContent = 'Файл бэлэн. Хадгалах дарна уу.'; }, er => { st.textContent = 'Алдаа: ' + er.message; })
    .finally(() => upl = false);
};

function openForm(id, kind) {
  const it = S.items.find(x => x.id == id) || { type: kind || 'post' };
  fe.iid.value = it.id || ''; fe.kind.value = it.type; fe.ttl.value = it.title || '';
  fe.link.value = it.url || ''; fe.subs.value = it.subs || ''; fe.txt.value = it.body || ''; fe.vf.value = '';
  sync(); $('#dm').showModal();
}
fm.onsubmit = e => {
  e.preventDefault();
  if (upl) { alert('Файл хуулж дуустал хүлээнэ үү.'); return; }
  const id = fe.iid.value, old = S.items.find(x => x.id == id);
  const it = { id: id || Date.now().toString(36), type: fe.kind.value, title: fe.ttl.value.trim(), url: fe.link.value.trim(), subs: fe.subs.value.trim(), body: fe.txt.value, date: old ? old.date : new Date().toISOString().slice(0, 10) };
  if (old) Object.assign(old, it); else S.items.unshift(it);
  save(); $('#dm').close(); location.hash = it.type; render();
};

const fa = $('#fa'), ae = fa.elements; let pend = null;
ae.pf.onchange = () => {
  const fl = ae.pf.files[0]; if (!fl) return;
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = im.width * k; c.height = im.height * k;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    if (FBST) {
      $('#pst').textContent = 'Хуулж байна…';
      c.toBlob(b => FB.upload(b, 'profile/me-' + Date.now() + '.jpg').then(u => { pend = u; $('#pst').textContent = 'Зураг бэлэн. Хадгалах дарна уу.'; }, () => { pend = c.toDataURL('image/jpeg', .85); $('#pst').textContent = 'Зураг бэлэн. Хадгалах дарна уу.'; }), 'image/jpeg', .85);
    } else { pend = c.toDataURL('image/jpeg', .85); $('#pst').textContent = 'Зураг сонгогдлоо. Хадгалах дарна уу.'; }
  }; im.src = r.result; };
  r.readAsDataURL(fl);
};
fa.onsubmit = e => {
  e.preventDefault();
  S.profile.name = ae.nm.value.trim() || S.profile.name; S.profile.bio = ae.bio.value;
  S.profile.photo = pend || ae.purl.value.trim() || S.profile.photo;
  save(); $('#am').close(); render();
};

// ===== Үйлдлүүд =====
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a == 'close') b.closest('dialog').close();
  else if (a == 'dc') { if (confirm('Коммент устгах уу?')) CM.del(id).then(loadCm); }
  else if (a == 'cm') { $('#rd').close(); openCm(id); }
  else if (a == 'read') {
    const it = S.items.find(x => x.id == id);
    $('#rd').innerHTML = `<button data-a="close">Хаах</button> <button data-a="cm" data-id="${id}">Коммент</button><h2 style="color:var(--tx);margin:20px 0 0;font-size:1.6rem">${esc(it.title)}</h2><div class="rt ${it.type}">${esc(it.body)}</div>`;
    $('#rd').showModal();
  }
  else if (a == 'in') { if (prompt('Нууц үг') === CFG.pass) { admin = true; sessionStorage.setItem('adm', '1'); render(); } }
  else if (a == 'out') { if (FBON) FB.logout(); admin = false; sessionStorage.removeItem('adm'); render(); }
  else if (a == 'add') openForm(null, b.dataset.k);
  else if (a == 'edit') openForm(id);
  else if (a == 'del') { if (confirm('Устгах уу?')) { S.items = S.items.filter(x => x.id != id); save(); render(); } }
  else if (a == 'about') { pend = null; ae.nm.value = S.profile.name; ae.bio.value = S.profile.bio; ae.purl.value = S.profile.photo.startsWith('data:') ? '' : S.profile.photo; ae.pf.value = ''; $('#am').showModal(); }
  else if (a == 'export') {
    const t = 'const SEED = ' + JSON.stringify(S, null, 1) + ';';
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Хуулагдлаа. index.html доторх “const SEED = …;” хэсгийг үүгээр солиод дахин deploy хийнэ.'), () => prompt('Энийг хуулна уу', t));
  }
  else if (a == 'reset') { if (confirm('Энэ браузер дээрх өөрчлөлтийг арилгаад файл доторх агуулга руу буцах уу?')) { localStorage.removeItem('site-v1'); S = structuredClone(SEED); render(); } }
});
// ===== Коммент =====
const cf = $('#cf'), ce = cf.elements; let cmId = null;
async function loadCm() {
  const L = $('#cm-l');
  if (!(window.CM && CM.on)) { cf.hidden = true; L.innerHTML = '<p class="mu">Коммент одоогоор холбогдоогүй байна.</p>'; return; }
  cf.hidden = false; L.innerHTML = '<p class="mu">Уншиж байна…</p>';
  try {
    const r = await CM.load(cmId);
    L.innerHTML = r.length ? r.map(c => `<div class="cmt"><b>${esc(c.name)}</b><small>${c.t ? new Date(c.t.seconds * 1000).toISOString().slice(0, 10) : ''}</small><p>${esc(c.text)}</p>${admin ? `<button data-a="dc" data-id="${c.id}">Устгах</button>` : ''}</div>`).join('') : '<p class="mu">Анхны коммент болоорой.</p>';
  } catch (e) { L.innerHTML = '<p class="mu">Коммент уншиж чадсангүй.</p>'; }
}
function openCm(id) {
  const it = S.items.find(x => x.id == id); if (!it) return;
  cmId = id; $('#cm-t').textContent = it.title; $('#cm-s').textContent = '';
  ce.nm.value = localStorage.getItem('cm-name') || ''; ce.tx.value = '';
  $('#cm').showModal(); loadCm();
}
cf.onsubmit = async e => {
  e.preventDefault(); const st = $('#cm-s');
  if (ce.website.value) return;
  const nm = ce.nm.value.trim().slice(0, 40), tx = ce.tx.value.trim().slice(0, 500);
  if (!nm || !tx) return;
  if (Date.now() - (+localStorage.getItem('cm-last') || 0) < 30000) { st.textContent = '30 секунд хүлээгээд дахин илгээнэ үү.'; return; }
  st.textContent = 'Илгээж байна…';
  try { await CM.add(cmId, nm, tx); localStorage.setItem('cm-last', Date.now()); localStorage.setItem('cm-name', nm); ce.tx.value = ''; st.textContent = ''; loadCm(); }
  catch (x) { st.textContent = 'Илгээж чадсангүй. Дахин оролдоно уу.'; }
};

addEventListener('fb-ready', () => {
  if (!FBON) return;
  // ШИНЭЭР НЭМСЭН: Татаж дууссаны дараа isLoading = false болгоод жинхэнэ өгөгдлийг зурах
  FB.onAuth(u => { admin = !!u; if (!isLoading) render(); });
  FB.loadSite().then(d => { 
    if (d) { S = d; } 
    isLoading = false; 
    render(); 
  }).catch(() => {
    isLoading = false;
    render();
  });
});
$('#lf').onsubmit = e => {
  e.preventDefault(); const f = e.target.elements;
  FB.login(f.em.value.trim(), f.pw.value).then(() => { $('#lg').close(); f.pw.value = ''; $('#lg-s').textContent = ''; }, () => { $('#lg-s').textContent = 'Имэйл эсвэл нууц үг буруу байна.'; });
};

function gate() {
  if (location.hash !== '#' + CFG.door) return;
  history.replaceState(null, '', location.pathname + location.search); // хаягаас нууц үгийг арилгана
  if (FBON) { if (!admin) $('#lg').showModal(); return; }
  if (!admin && prompt('Нууц үг') === CFG.pass) { admin = true; sessionStorage.setItem('adm', '1'); }
}
addEventListener('hashchange', () => { gate(); render(); });
gate(); render();
</script>
<script type="module">
const V = '10.12.0', G = 'https://www.gstatic.com/firebasejs/' + V + '/';
const F = CFG.firebase, on = !!(F && F.projectId);
if (!on) { window.CM = { on: false }; window.FB = { on: false }; }
else {
  const { initializeApp } = await import(G + 'firebase-app.js');
  const { getFirestore, collection, addDoc, getDocs, getDoc, setDoc, deleteDoc, doc, query, where, limit, serverTimestamp } = await import(G + 'firebase-firestore.js');
  const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = await import(G + 'firebase-auth.js');
  const app = initializeApp(F), db = getFirestore(app), au = getAuth(app);
  window.CM = {
    on: true,
    async load(id) {
      const s = await getDocs(query(collection(db, 'comments'), where('itemId', '==', id), limit(100)));
      return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.t?.seconds || 0) - (a.t?.seconds || 0));
    },
    async add(id, name, text) { await addDoc(collection(db, 'comments'), { itemId: id, name, text, t: serverTimestamp() }); },
    del: id => deleteDoc(doc(db, 'comments', id))
  };
  window.FB = {
    on: true,
    async loadSite() { const s = await getDoc(doc(db, 'site', 'main')); return s.exists() ? JSON.parse(s.data().json) : null; },
    saveSite: d => setDoc(doc(db, 'site', 'main'), { json: JSON.stringify(d) }),
    login: (e, p) => signInWithEmailAndPassword(au, e, p),
    logout: () => signOut(au),
    onAuth: cb => onAuthStateChanged(au, cb),
    async upload(file, path, prog) {
      const { getStorage, ref, uploadBytesResumable, getDownloadURL } = await import(G + 'firebase-storage.js');
      const r = ref(getStorage(app), path);
      return new Promise((res, rej) => {
        const t = uploadBytesResumable(r, file);
        t.on('state_changed', s => prog && prog(s.bytesTransferred / s.totalBytes), rej, () => getDownloadURL(t.snapshot.ref).then(res, rej));
      });
    }
  };
}
dispatchEvent(new Event('fb-ready'));
</script>
